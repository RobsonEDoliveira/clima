<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClimaTempo 15D — Previsão do Tempo Simples</title>
  <meta name="description" content="Previsão do tempo para hoje e os próximos 15 dias. Simples, rápido e direto." />
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-alt: #1a2642;
      --border: #263554;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --temp-max: #fb7185;
      --temp-min: #60a5fa;
      --rain: #38bdf8;
      --success: #4ade80;
      --warning: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ============ HEADER ============ */
    header {
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 520px;
      gap: 0.5rem;
      position: relative;
      min-width: 240px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.7rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn {
      background: var(--primary);
      color: #082f49;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: scale(0.97); }

    .btn-geo {
      background: var(--surface-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.7rem 0.9rem;
    }

    .btn-geo:hover { background: var(--border); }

    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      z-index: 200;
      overflow: hidden;
      display: none;
      max-height: 280px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: rgba(56, 189, 248, 0.15); }
    .suggestion-sub { color: var(--text-muted); font-size: 0.78rem; }

    /* ============ MAIN ============ */
    main {
      max-width: 1120px;
      margin: 1.5rem auto;
      padding: 0 1rem 3rem;
    }

    /* ============ CURRENT BANNER ============ */
    .current-banner {
      background: linear-gradient(135deg, #162442 0%, #11192e 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: center;
    }

    .city-info h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
      letter-spacing: -0.5px;
    }

    .city-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
    }

    .current-desc {
      color: var(--primary);
      font-weight: 600;
      font-size: 1.05rem;
    }

    .current-temp-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .current-icon { font-size: 3.75rem; line-height: 1; }

    .current-temp {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .current-stats {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      font-size: 0.88rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-val { font-weight: 700; font-size: 1rem; }

    /* ============ SECTION HEADER ============ */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .section-header h2 { font-size: 1.2rem; font-weight: 700; }
    .section-header span { font-size: 0.82rem; color: var(--text-muted); }

    /* ============ FORECAST GRID ============ */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.85rem;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .day-card:hover {
      transform: translateY(-3px);
      border-color: #3b5280;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .day-card.today-card {
      border-color: var(--primary);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.1) 0%, var(--surface) 100%);
    }

    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .day-name {
      font-weight: 800;
      font-size: 1rem;
      text-transform: capitalize;
    }

    .day-date { font-size: 0.78rem; color: var(--text-muted); }
    .day-icon { font-size: 2.2rem; line-height: 1; }

    .day-condition {
      font-size: 0.86rem;
      color: var(--text-main);
      font-weight: 500;
      min-height: 2.4em;
      display: flex;
      align-items: center;
    }

    .temps-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
    }

    .temp-item { display: flex; flex-direction: column; }
    .temp-item span:first-child {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .t-min { color: var(--temp-min); font-weight: 800; font-size: 1.15rem; }
    .t-max { color: var(--temp-max); font-weight: 800; font-size: 1.15rem; }

    .day-details {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
    }

    .rain-prob { color: var(--rain); font-weight: 600; }

    /* Barra visual de probabilidade de chuva */
    .rain-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      margin-top: 0.4rem;
      overflow: hidden;
    }

    .rain-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #818cf8);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ============ HOURLY (today) ============ */
    .hourly-strip {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 0.5rem 0 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .hourly-strip::-webkit-scrollbar { height: 8px; }
    .hourly-strip::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .hour-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      min-width: 78px;
      text-align: center;
      flex-shrink: 0;
    }

    .hour-card.now {
      border-color: var(--primary);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.12) 0%, var(--surface) 100%);
    }

    .hour-time { font-size: 0.75rem; color: var(--text-muted); }
    .hour-icon { font-size: 1.5rem; margin: 0.25rem 0; }
    .hour-temp { font-weight: 700; font-size: 0.95rem; }
    .hour-rain { font-size: 0.7rem; color: var(--rain); margin-top: 0.15rem; }

    /* ============ MESSAGES ============ */
    .message-box {
      text-align: center;
      padding: 3rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-muted);
    }

    .message-box strong { color: var(--text-main); }
    .error-msg { border-color: var(--temp-max); color: #fecdd3; }

    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ FOOTER ============ */
    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--primary); text-decoration: none; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      .current-banner {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .current-temp-wrap { justify-content: center; }
      .current-icon { font-size: 3rem; }
      .current-temp { font-size: 3rem; }
      .city-info h1 { font-size: 1.4rem; }
      .header-container { flex-direction: column; align-items: stretch; }
      .search-box { max-width: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <span>⛅</span>
        <span>ClimaTempo 15D</span>
      </div>

      <form class="search-box" id="search-form" autocomplete="off">
        <input
          type="text"
          id="city-input"
          placeholder="Digite a cidade (ex: Belo Horizonte, São Paulo...)"
          aria-label="Nome da cidade"
          autocomplete="off"
        />
        <button type="submit" class="btn">Buscar</button>
        <button type="button" class="btn btn-geo" id="geo-btn" title="Usar minha localização atual" aria-label="Usar minha localização">📍</button>
        <div class="suggestions" id="suggestions-list" role="listbox"></div>
      </form>
    </div>
  </header>

  <main>
    <div id="weather-content">
      <div class="message-box"><span class="spinner"></span>Carregando dados meteorológicos...</div>
    </div>
  </main>

  <footer>
    Dados fornecidos por <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> • Previsão combinada de múltiplos modelos meteorológicos
  </footer>

  <script>
    "use strict";

    // ============ BASE DE CIDADES (FALLBACK OFFLINE) ============
    const CIDADES_BASE = [
      { name: "Belo Horizonte", admin1: "Minas Gerais", country: "Brasil", latitude: -19.9208, longitude: -43.9378 },
      { name: "São Paulo", admin1: "São Paulo", country: "Brasil", latitude: -23.5505, longitude: -46.6333 },
      { name: "Rio de Janeiro", admin1: "Rio de Janeiro", country: "Brasil", latitude: -22.9068, longitude: -43.1729 },
      { name: "Brasília", admin1: "Distrito Federal", country: "Brasil", latitude: -15.7801, longitude: -47.9292 },
      { name: "Salvador", admin1: "Bahia", country: "Brasil", latitude: -12.9714, longitude: -38.5014 },
      { name: "Fortaleza", admin1: "Ceará", country: "Brasil", latitude: -3.7319, longitude: -38.5267 },
      { name: "Curitiba", admin1: "Paraná", country: "Brasil", latitude: -25.4284, longitude: -49.2733 },
      { name: "Manaus", admin1: "Amazonas", country: "Brasil", latitude: -3.1190, longitude: -60.0217 },
      { name: "Recife", admin1: "Pernambuco", country: "Brasil", latitude: -8.0476, longitude: -34.8770 },
      { name: "Porto Alegre", admin1: "Rio Grande do Sul", country: "Brasil", latitude: -30.0346, longitude: -51.2177 },
      { name: "Goiânia", admin1: "Goiás", country: "Brasil", latitude: -16.6864, longitude: -49.2643 },
      { name: "Belém", admin1: "Pará", country: "Brasil", latitude: -1.4558, longitude: -48.4902 },
      { name: "Vitória", admin1: "Espírito Santo", country: "Brasil", latitude: -20.3155, longitude: -40.3128 },
      { name: "Florianópolis", admin1: "Santa Catarina", country: "Brasil", latitude: -27.5954, longitude: -48.5480 },
      { name: "Campinas", admin1: "São Paulo", country: "Brasil", latitude: -22.9099, longitude: -47.0626 },
      { name: "Guarulhos", admin1: "São Paulo", country: "Brasil", latitude: -23.4543, longitude: -46.5337 },
      { name: "Goiânia", admin1: "Goiás", country: "Brasil", latitude: -16.6864, longitude: -49.2643 },
      { name: "Ribeirão das Neves", admin1: "Minas Gerais", country: "Brasil", latitude: -19.7686, longitude: -44.0886 },
      { name: "Contagem", admin1: "Minas Gerais", country: "Brasil", latitude: -19.9317, longitude: -44.0539 },
      { name: "Betim", admin1: "Minas Gerais", country: "Brasil", latitude: -19.9678, longitude: -44.1981 }
    ];

    const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';
    const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';

    // ============ ELEMENTOS DOM ============
    const cityInput = document.getElementById('city-input');
    const suggestionsList = document.getElementById('suggestions-list');
    const weatherContent = document.getElementById('weather-content');
    const searchForm = document.getElementById('search-form');
    const geoBtn = document.getElementById('geo-btn');
    let debounceTimer = null;

    // ============ INTERPRETAR CÓDIGOS WMO ============
    function interpretarWMO(code) {
      const mapa = {
        0:  { texto: 'Céu limpo', icone: '☀️' },
        1:  { texto: 'Predominantemente limpo', icone: '🌤️' },
        2:  { texto: 'Parcialmente nublado', icone: '⛅' },
        3:  { texto: 'Nublado', icone: '☁️' },
        45: { texto: 'Nevoeiro', icone: '🌫️' },
        48: { texto: 'Nevoeiro com geada', icone: '🌫️' },
        51: { texto: 'Garoa leve', icone: '🌦️' },
        53: { texto: 'Garoa moderada', icone: '🌦️' },
        55: { texto: 'Garoa intensa', icone: '🌧️' },
        56: { texto: 'Garoa congelante leve', icone: '🌧️' },
        57: { texto: 'Garoa congelante intensa', icone: '🌧️' },
        61: { texto: 'Chuva fraca', icone: '🌦️' },
        63: { texto: 'Chuva moderada', icone: '🌧️' },
        65: { texto: 'Chuva forte', icone: '⛈️' },
        66: { texto: 'Chuva congelante leve', icone: '🌧️' },
        67: { texto: 'Chuva congelante forte', icone: '🌧️' },
        71: { texto: 'Neve fraca', icone: '🌨️' },
        73: { texto: 'Neve moderada', icone: '🌨️' },
        75: { texto: 'Neve intensa', icone: '❄️' },
        77: { texto: 'Grãos de neve', icone: '🌨️' },
        80: { texto: 'Pancadas leves', icone: '🌦️' },
        81: { texto: 'Pancadas moderadas', icone: '🌧️' },
        82: { texto: 'Pancadas fortes', icone: '⛈️' },
        85: { texto: 'Pancadas de neve', icone: '🌨️' },
        86: { texto: 'Pancadas fortes de neve', icone: '❄️' },
        95: { texto: 'Trovoada', icone: '⛈️' },
        96: { texto: 'Trovoada com granizo leve', icone: '⛈️' },
        99: { texto: 'Trovoada com granizo forte', icone: '⛈️' }
      };
      return mapa[code] || { texto: 'Condição variável', icone: '🌡️' };
    }

    // ============ FORMATAR DATA ============
    function formatarDataCard(dateStr, index) {
      const parts = dateStr.split('-').map(Number);
      const dataObj = new Date(parts[0], parts[1] - 1, parts[2]);

      let diaSemana;
      if (index === 0) diaSemana = 'Hoje';
      else if (index === 1) diaSemana = 'Amanhã';
      else diaSemana = dataObj.toLocaleDateString('pt-BR', { weekday: 'long' });

      const dataCurta = dataObj.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'short'
      });

      return { diaSemana, dataCurta };
    }

    // ============ FETCH COM TIMEOUT (compatível com navegadores antigos) ============
    function fetchComTimeout(url, ms) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        fetch(url, { signal: controller.signal })
          .then(resolve, reject)
          .finally(() => clearTimeout(timer));
      });
    }

    // ============ BUSCAR CIDADES ============
    async function procurarCidades(termo) {
      const termoLower = termo.toLowerCase();
      // Filtro local instantâneo
      const locais = CIDADES_BASE.filter(c =>
        c.name.toLowerCase().includes(termoLower) ||
        c.admin1.toLowerCase().includes(termoLower)
      );

      try {
        const res = await fetchComTimeout(
          `${GEO_API}?name=${encodeURIComponent(termo)}&count=8&language=pt&format=json`,
          3500
        );
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          return data.results.map(c => ({
            name: c.name,
            admin1: c.admin1 || '',
            country: c.country || '',
            latitude: c.latitude,
            longitude: c.longitude
          }));
        }
      } catch (e) {
        // Se a API falhar (rede/CORS), usa o fallback local
        if (locais.length > 0) return locais;
        throw e;
      }

      return locais;
    }

    // ============ AUTOCOMPLETE ============
    cityInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const termo = cityInput.value.trim();

      if (termo.length < 2) {
        suggestionsList.style.display = 'none';
        suggestionsList.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const resultados = await procurarCidades(termo);
          if (!resultados.length) {
            suggestionsList.style.display = 'none';
            return;
          }

          suggestionsList.innerHTML = resultados.map((cidade, idx) => {
            const regiao = [cidade.admin1, cidade.country].filter(Boolean).join(' - ');
            // Usa data-index em vez de onclick inline para evitar quebra com caracteres especiais
            return `
              <div class="suggestion-item" data-index="${idx}" role="option" tabindex="0">
                <strong>${escapeHtml(cidade.name)}</strong>
                <span class="suggestion-sub">${escapeHtml(regiao)}</span>
              </div>
            `;
          }).join('');

          // Armazena resultados para acesso no click
          suggestionsList._resultados = resultados;
          suggestionsList.style.display = 'block';
        } catch (e) {
          suggestionsList.style.display = 'none';
        }
      }, 280);
    });

    // Event delegation para sugestões (mais robusto que onclick inline)
    suggestionsList.addEventListener('click', (e) => {
      const item = e.target.closest('.suggestion-item');
      if (!item) return;
      const idx = parseInt(item.dataset.index, 10);
      const resultados = suggestionsList._resultados;
      if (resultados && resultados[idx]) {
        selecionarCidade(resultados[idx]);
      }
    });

    suggestionsList.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const item = e.target.closest('.suggestion-item');
      if (!item) return;
      e.preventDefault();
      const idx = parseInt(item.dataset.index, 10);
      const resultados = suggestionsList._resultados;
      if (resultados && resultados[idx]) {
        selecionarCidade(resultados[idx]);
      }
    });

    // Fecha sugestões ao clicar fora
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-box')) {
        suggestionsList.style.display = 'none';
      }
    });

    // ============ SUBMIT DO FORM ============
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      suggestionsList.style.display = 'none';
      const termo = cityInput.value.trim();
      if (!termo) return;

      weatherContent.innerHTML = `<div class="message-box"><span class="spinner"></span>Buscando cidade "${escapeHtml(termo)}"...</div>`;

      try {
        const encontrados = await procurarCidades(termo);
        if (encontrados.length > 0) {
          selecionarCidade(encontrados[0]);
        } else {
          weatherContent.innerHTML = `
            <div class="message-box error-msg">
              Cidade "<strong>${escapeHtml(termo)}</strong>" não encontrada.<br/>
              <small>Tente digitar o nome completo ou use o botão 📍 para sua localização.</small>
            </div>
          `;
        }
      } catch (err) {
        weatherContent.innerHTML = `
          <div class="message-box error-msg">
            Erro ao buscar a cidade.<br/>
            <small>${escapeHtml(err.message)}</small>
          </div>
        `;
      }
    });

    // ============ GEOLOCALIZAÇÃO ============
    geoBtn.addEventListener('click', usarLocalizacaoAtual);

    function usarLocalizacaoAtual() {
      if (!navigator.geolocation) {
        alert('Seu navegador não suporta geolocalização.');
        return;
      }

      weatherContent.innerHTML = `<div class="message-box"><span class="spinner"></span>Obtendo sua localização atual via GPS...</div>`;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const localGeo = {
            name: 'Minha Localização',
            admin1: '',
            country: '',
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude
          };
          cityInput.value = '';
          buscarPrevisao(localGeo);
        },
        () => {
          weatherContent.innerHTML = `
            <div class="message-box error-msg">
              Permissão de localização negada ou indisponível.<br/>
              <small>Digite o nome da cidade acima ou clique em 📍 e autorize o acesso.</small>
            </div>
          `;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
      );
    }

    // ============ SELECIONAR CIDADE ============
    function selecionarCidade(cidadeObj) {
      suggestionsList.style.display = 'none';
      suggestionsList.innerHTML = '';
      cityInput.value = cidadeObj.name;
      try {
        localStorage.setItem('ultimaCidadeClima', JSON.stringify(cidadeObj));
      } catch (e) {}
      buscarPrevisao(cidadeObj);
    }

    // ============ BUSCAR PREVISÃO (com fallback de modelo) ============
    async function buscarPrevisao(local) {
      weatherContent.innerHTML = `<div class="message-box"><span class="spinner"></span>Carregando previsão de alta precisão para <strong>${escapeHtml(local.name)}</strong>...</div>`;

      const paramsBase = {
        latitude: local.latitude,
        longitude: local.longitude,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m',
        hourly: 'temperature_2m,precipitation_probability,weather_code',
        daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,uv_index_max,sunrise,sunset',
        timezone: 'auto',
        forecast_days: '16'
      };

      function buildUrl(useBestMatch) {
        const p = new URLSearchParams(paramsBase);
        if (useBestMatch) p.append('models', 'best_match');
        return `${WEATHER_API}?${p.toString()}`;
      }

      try {
        // Tenta primeiro com best_match (modelo combinado de maior precisão)
        let res = await fetchComTimeout(buildUrl(true), 12000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        let dados = await res.json();

        // Validação: se não veio daily, tenta sem best_match
        if (!dados.daily || !dados.daily.time || dados.daily.time.length === 0) {
          res = await fetchComTimeout(buildUrl(false), 12000);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          dados = await res.json();
        }

        if (!dados.daily || !dados.daily.time) {
          throw new Error('Resposta da API inválida');
        }

        renderizarClima(local, dados);
      } catch (err) {
        // Segunda tentativa: sem best_match, sem hourly
        try {
          const p = new URLSearchParams({
            latitude: local.latitude,
            longitude: local.longitude,
            current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m',
            daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max',
            timezone: 'auto',
            forecast_days: '16'
          });
          const res2 = await fetchComTimeout(`${WEATHER_API}?${p.toString()}`, 12000);
          if (!res2.ok) throw new Error('HTTP ' + res2.status);
          const dados2 = await res2.json();
          renderizarClima(local, dados2);
        } catch (err2) {
          weatherContent.innerHTML = `
            <div class="message-box error-msg">
              <strong>Não foi possível carregar a previsão.</strong><br/>
              Verifique sua conexão com a internet e tente novamente.<br/>
              <small>Detalhe: ${escapeHtml(err2.message)}</small>
            </div>
          `;
        }
      }
    }

    // ============ RENDERIZAR CLIMA ============
    function renderizarClima(local, dados) {
      const atual = dados.current || {};
      const diario = dados.daily || {};
      const horario = dados.hourly || {};
      const condAtual = interpretarWMO(atual.weather_code);

      const subtituloLocal = [local.admin1, local.country].filter(Boolean).join(', ');
      const horaAtualizacao = atual.time
        ? new Date(atual.time).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        : '--:--';

      // ============ HOURLY (próximas 24h a partir de agora) ============
      let hourlyHtml = '';
      if (horario.time && horario.time.length > 0) {
        const agora = new Date();
        const inicioIdx = horario.time.findIndex(t => new Date(t) >= agora);
        const startIdx = inicioIdx >= 0 ? inicioIdx : 0;
        const endIdx = Math.min(startIdx + 24, horario.time.length);
        const nowHour = agora.getHours();

        const hourCards = [];
        for (let i = startIdx; i < endIdx; i++) {
          const horaDate = new Date(horario.time[i]);
          const hora = horaDate.getHours();
          const isNow = (i === startIdx);
          const cond = interpretarWMO(horario.weather_code[i]);
          const temp = Math.round(horario.temperature_2m[i]);
          const prob = horario.precipitation_probability ? (horario.precipitation_probability[i] ?? 0) : 0;

          hourCards.push(`
            <div class="hour-card ${isNow ? 'now' : ''}">
              <div class="hour-time">${isNow ? 'Agora' : hora.toString().padStart(2, '0') + 'h'}</div>
              <div class="hour-icon">${cond.icone}</div>
              <div class="hour-temp">${temp}°</div>
              <div class="hour-rain">${prob}%</div>
            </div>
          `);
        }
        hourlyHtml = `
          <div class="section-header">
            <h2>Próximas 24 Horas</h2>
            <span>Previsão hora a hora</span>
          </div>
          <div class="hourly-strip">${hourCards.join('')}</div>
        `;
      }

      // ============ 16 DIAS (Hoje + 15) ============
      const cardsDiasHtml = diario.time.map((dataStr, idx) => {
        const { diaSemana, dataCurta } = formatarDataCard(dataStr, idx);
        const cond = interpretarWMO(diario.weather_code[idx]);
        const tMin = Math.round(diario.temperature_2m_min[idx]);
        const tMax = Math.round(diario.temperature_2m_max[idx]);
        const probChuva = diario.precipitation_probability_max ? (diario.precipitation_probability_max[idx] ?? 0) : 0;
        const volChuva = (diario.precipitation_sum[idx] ?? 0).toFixed(1);
        const ventoMax = Math.round(diario.wind_speed_10m_max[idx] ?? 0);
        const uvMax = diario.uv_index_max ? (diario.uv_index_max[idx] ?? 0).toFixed(1) : null;

        return `
          <article class="day-card ${idx === 0 ? 'today-card' : ''}">
            <div>
              <div class="day-top">
                <div>
                  <div class="day-name">${diaSemana}</div>
                  <div class="day-date">${dataCurta}</div>
                </div>
                <div class="day-icon" title="${cond.texto}">${cond.icone}</div>
              </div>
              <div class="day-condition">${cond.texto}</div>
            </div>

            <div>
              <div class="temps-row">
                <div class="temp-item">
                  <span>Mín</span>
                  <span class="t-min">${tMin}°</span>
                </div>
                <div class="temp-item" style="text-align: right;">
                  <span>Máx</span>
                  <span class="t-max">${tMax}°</span>
                </div>
              </div>

              <div class="rain-bar">
                <div class="rain-bar-fill" style="width: ${probChuva}%"></div>
              </div>

              <div class="day-details">
                <span class="rain-prob" title="Probabilidade de chuva e volume previsto">💧 ${probChuva}% • ${volChuva}mm</span>
                <span title="Vento máximo">💨 ${ventoMax} km/h</span>
              </div>
              ${uvMax ? `<div class="day-details" style="border-top: none; padding-top: 0.3rem;"><span>☀️ UV ${uvMax}</span><span></span></div>` : ''}
            </div>
          </article>
        `;
      }).join('');

      // ============ STATS ATUAIS ============
      const stats = [
        { label: 'Sensação Térmica', val: Math.round(atual.apparent_temperature) + '°C' },
        { label: 'Umidade Relativa', val: (atual.relative_humidity_2m ?? '--') + '%' },
        { label: 'Vento Atual', val: Math.round(atual.wind_speed_10m) + ' km/h' },
        { label: 'Precipitação Agora', val: (atual.precipitation ?? 0) + ' mm' }
      ];

      const statsHtml = stats.map(s => `
        <div class="stat-item">
          <span class="stat-label">${s.label}</span>
          <span class="stat-val">${s.val}</span>
        </div>
      `).join('');

      weatherContent.innerHTML = `
        <section class="current-banner">
          <div class="city-info">
            <h1>${escapeHtml(local.name)}</h1>
            <div class="city-meta">
              ${subtituloLocal ? escapeHtml(subtituloLocal) + ' • ' : ''}Lat ${local.latitude.toFixed(2)}, Lon ${local.longitude.toFixed(2)} • Atualizado às ${horaAtualizacao}
            </div>
            <div class="current-desc">${condAtual.icone} ${condAtual.texto}</div>
          </div>

          <div class="current-temp-wrap">
            <span class="current-icon">${condAtual.icone}</span>
            <span class="current-temp">${Math.round(atual.temperature_2m)}°</span>
          </div>

          <div class="current-stats">
            ${statsHtml}
          </div>
        </section>

        ${hourlyHtml}

        <div class="section-header">
          <h2>Previsão para 16 Dias</h2>
          <span>Hoje + 15 dias consecutivos</span>
        </div>

        <section class="forecast-grid">
          ${cardsDiasHtml}
        </section>
      `;

      // Rola para o topo da previsão
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============ ESCAPE HTML (segurança contra XSS e quebra de layout) ============
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============ INIT ============
    window.addEventListener('DOMContentLoaded', () => {
      const salva = localStorage.getItem('ultimaCidadeClima');
      if (salva) {
        try {
          const cidade = JSON.parse(salva);
          if (cidade && cidade.latitude != null && cidade.longitude != null) {
            cityInput.value = cidade.name;
            buscarPrevisao(cidade);
            return;
          }
        } catch (e) {}
      }
      // Inicializa com Belo Horizonte por padrão
      selecionarCidade(CIDADES_BASE[0]);
    });
  </script>
</body>
</html>
